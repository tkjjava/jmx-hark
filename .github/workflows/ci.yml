name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check hark_bridge tests

      - name: Check formatting
        run: ruff format --check hark_bridge tests

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests -v

      - name: Verify package imports
        run: python -c "import hark_bridge; print(hark_bridge.__author__, hark_bridge.__mark__)"

      # 用 Python 脚本做启动冒烟：跨平台、不依赖 bash 的后台任务控制，
      # 失败时能看到实际返回值而不是只有 curl 的退出码。
      - name: Smoke test server startup
        env:
          PYTHONIOENCODING: utf-8
          HARK_BRIDGE_KEY: "Yk1vR3g5dExhM3BXNnFSc1Q5dUMyeVphNGJDNWRFRmdoSTBrTG1Ob1BxUT0="
          HARK_BRIDGE_DB: "./ci-smoke.db"
          HARK_BRIDGE_PORT: "18787"
        run: python -m hark_bridge.smoke
