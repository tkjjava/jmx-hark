<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>导入会话</title>
<style>
 body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;width:320px;
      margin:0;padding:16px;font-size:13px;color:#1a1a1a}
 h2{font-size:14px;margin:0 0 12px;font-weight:600}
 label{display:block;margin:10px 0 4px;color:#666;font-size:12px}
 input{width:100%;padding:6px 8px;border:1px solid #d0d0d0;border-radius:5px;
      font-size:13px;box-sizing:border-box}
 button{margin-top:14px;width:100%;padding:8px;background:#1a1a1a;color:#fff;
      border:0;border-radius:5px;font-size:13px;cursor:pointer}
 button:disabled{opacity:.5;cursor:default}
 pre{background:#f5f5f5;padding:8px;border-radius:5px;font-size:11px;
      overflow:auto;white-space:pre-wrap;margin:12px 0 0;max-height:180px}
 .status{font-size:12px;color:#666;margin-bottom:8px}
 .ok{color:#146c2e}
 .bad{color:#a4262c}
</style>
<h2>导入会话到 hark-bridge</h2>
<div class="status" id="status">检查本机服务…</div>

<label>账号标签（必填）</label>
<input id="account" placeholder="me-main">
<label>显示名（可选）</label>
<input id="label" placeholder="主号">

<button id="go" disabled>读取 Cookie 并导入</button>
<pre id="out"></pre>

<script src="popup.js"></script>
